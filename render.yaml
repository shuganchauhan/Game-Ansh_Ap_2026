databases:
  - name: gamers-g-db
    databaseName: gamers_g
    user: gamers_g_user
    plan: free

services:
  - type: web
    name: gamers-g-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm run migrate && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gamers-g-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: STRICT_LIMIT_WINDOW_MS
        value: 3600000
      - key: STRICT_LIMIT_MAX
        value: 30
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@gamersg.com
      - key: ADMIN_PASSWORD
        generateValue: true
